name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/v') }}

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run verify
      - name: Validate release tag and changelog
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          node -e "const p=require('./package.json'); if (process.env.RELEASE_TAG !== 'v'+p.version) throw new Error('Git tag must equal v'+p.version)"
          node scripts/extract-changelog.mjs "$RELEASE_TAG" CHANGELOG.md > /dev/null

  package:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: verify
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            command: package:mac:arm64
            artifact: mac-arm64
          - runner: macos-15-intel
            command: package:mac:x64
            artifact: mac-x64
          - runner: windows-latest
            command: package:win:x64
            artifact: windows-x64
    runs-on: ${{ matrix.runner }}
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run test
      - name: Package on macOS
        if: runner.os == 'macOS'
        shell: bash
        run: |
          ulimit -n "$(ulimit -Hn)"
          echo "Open file limit: $(ulimit -n)"
          npm run ${{ matrix.command }}
      - name: Package on Windows
        if: runner.os == 'Windows'
        run: npm run ${{ matrix.command }}
      - run: npm run test:packaged
      - name: Upload build artifacts (primary)
        id: upload-artifacts-v4
        uses: actions/upload-artifact@v4
        with:
          name: dsh-desktop-${{ matrix.artifact }}
          path: |
            release/*.dmg
            release/*.exe
            release/latest.yml
          if-no-files-found: error
      - name: Upload build artifacts (retry)
        if: failure() && steps.upload-artifacts-v4.outcome == 'failure'
        id: upload-artifacts-v4-retry
        uses: actions/upload-artifact@v4
        with:
          name: dsh-desktop-${{ matrix.artifact }}
          path: |
            release/*.dmg
            release/*.exe
            release/latest.yml
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [verify, package]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Verify tag matches application version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          node scripts/version.mjs check
          node -e "const p=require('./package.json'); if (process.env.RELEASE_TAG !== 'v'+p.version) throw new Error('Git tag must equal v'+p.version)"
      - name: Extract release notes from CHANGELOG.md
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: node scripts/extract-changelog.mjs "$RELEASE_TAG" CHANGELOG.md > release-notes.md
      - uses: actions/download-artifact@v4
        with:
          pattern: dsh-desktop-*
          path: release
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          name: DSH Desktop ${{ github.ref_name }}
          body_path: release-notes.md
          prerelease: ${{ contains(github.ref_name, '-') }}
          overwrite_files: true
          files: |
            release/*.dmg
            release/*.exe
            release/latest.yml
