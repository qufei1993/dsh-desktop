name: Feature Request
description: 提议新的能力或体验改进
title: "[Feature] "
labels: [enhancement, needs-triage]
body:
  - type: checkboxes
    id: checks
    attributes:
      label: 提交前确认
      options:
        - label: 我已搜索现有 Issue，未找到相同提案
          required: true
        - label: 该提案不要求修改、注入或接管官方 DeepSeek Harness
          required: true
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 请描述具体用户场景，不要只写期望的按钮或实现。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案
    validations:
      required: true
  - type: textarea
    id: boundaries
    attributes:
      label: 产品边界与风险
      description: 说明它是否影响 DSH_HOME、网络、版本安装、签名或跨平台行为。
    validations:
      required: true
