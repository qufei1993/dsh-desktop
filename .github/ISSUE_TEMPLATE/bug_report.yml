name: Bug Report
description: 报告可复现的 DSH Desktop 缺陷
title: "[Bug] "
labels: [bug, needs-triage]
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈。请勿提交 API Key、访问令牌、真实会话内容或未公开漏洞；安全问题请使用仓库 Security 页面私下报告。
  - type: checkboxes
    id: checks
    attributes:
      label: 提交前确认
      options:
        - label: 我已搜索现有 Issue，未找到相同问题
          required: true
        - label: 我确认问题发生在 DSH Desktop，而不只是官方 DeepSeek Harness
          required: true
        - label: 我已移除日志中的密钥和私人数据
          required: true
  - type: input
    id: desktop-version
    attributes:
      label: DSH Desktop 版本
      placeholder: 例如 0.1.0
    validations:
      required: true
  - type: input
    id: dsh-version
    attributes:
      label: DeepSeek Harness 版本
      placeholder: 例如 0.1.0-rc.6
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: 系统与架构
      options:
        - macOS Apple Silicon (arm64)
        - macOS Intel (x64)
        - Windows x64
        - 其他或不确定
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      placeholder: |
        1. 打开…
        2. 选择…
        3. 出现…
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期结果
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际结果与脱敏日志
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: 其他信息
      description: 可附截图、录屏、是否可稳定复现及最近一次正常版本。
